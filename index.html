const keys={left:false,right:false,jump:false};
let audioCtx=null;
function sound(type){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  const now=audioCtx.currentTime;
  const freq=type==="jump"?520:type==="star"?760:type==="goal"?880:180;
  o.frequency.setValueAtTime(freq,now);
  o.frequency.exponentialRampToValueAtTime(type==="jump"?300:type==="goal"?1200:90,now+.12);
  g.gain.setValueAtTime(.045,now);
  g.gain.exponentialRampToValueAtTime(.001,now+.13);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.14);
 }catch(e){}
}
function bind(id,k){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();if(k==="jump")sound("jump");keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 ["pointerdown","touchstart"].forEach(ev=>b.addEventListener(ev,down,{passive:false}));
 ["pointerup","pointercancel","pointerleave","touchend","touchcancel"].forEach(ev=>b.addEventListener(ev,up,{passive:false}));
}
bind("left","left");bind("right","right");bind("jump","jump");
addEventListener("keydown",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=true;
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=true;
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")keys.jump=true;
});
addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=false;
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=false;
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")keys.jump=false;
});

 worldWidth=Math.max(W*2.25,1500);
 plats=d.platforms.map(a=>({x:a[0]*worldWidth,y:a[1]*H,w:a[2]*worldWidth,h:Math.max(22,a[3]*H)}));
 const ground=plats[0];
 player={x:30,y:ground.y-54,w:32,h:54,vx:0,vy:0,on:false};
 // Enemy is placed on the middle section, not blocking the starting route.
 enemy=[];
 const enemyCount=level===0?4:level===1?6:8;
 for(let i=0;i<enemyCount;i++){
   const platformIndex=2+(i%(plats.length-2));
   const eb=plats[platformIndex];
   enemy.push({
     x:eb.x+Math.min(eb.w-78,12+(i%3)*18),
     y:eb.y-62,w:76,h:62,
     vx:(i%2? -1:1)*(1.45+level*.25+(i%3)*.12),
     platformIndex,dead:false
   });
 }
 flag={x:d.goal*worldWidth,y:plats[plats.length-1].y-105,w:9,h:105};
 stars=[];
 const starIndexes=[1,2,3,4,5,Math.min(plats.length-1,plats.length-2)];
 for(const idx of starIndexes){
   const b=plats[idx];
   stars.push({x:b.x+b.w/2,y:b.y-25,got:false});
 }
 cam=0;finished=false;jumpLatch=false;
 document.getElementById("lvl").textContent=`BÖLÜM ${level+1} / 3`;
 document.getElementById("lives").textContent="❤️❤️❤️";
 document.getElementById("stars").textContent=`⭐ 0 / 6`;
}
function begin(){document.getElementById("start").style.display="none";running=true;score=0;setup(0)}
document.getElementById("play").onclick=()=>{
 sound("start");
 begin();
};

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function resetPlayer(){
 player.x=30;player.y=plats[0].y-player.h;player.vx=0;player.vy=0;
}
function loseLife(){
 lives--;
 document.getElementById("lives").textContent="❤️".repeat(Math.max(0,lives))+"🖤".repeat(3-Math.max(0,lives));
 // Losing a life resets the current level's progress and all stars.
 for(const st of stars) st.got=false;
 score=0;
 document.getElementById("stars").textContent="⭐ 0 / 6";
 if(lives<=0){
   // Three lives are exhausted: return all the way to level 1.
   score=0;
   setup(0);
   return;
 }
 resetPlayer();
}

function update(){
 if(!running||finished)return;

 if(keys.left)player.vx-=.65;
 if(keys.right)player.vx+=.65;
 player.vx*=.83;
 player.vx=Math.max(-5.8,Math.min(5.8,player.vx));

 const jump=keys.jump&&!jumpLatch;
 jumpLatch=keys.jump;
 if(jump&&player.on){player.vy=-12.0;player.on=false}

 player.vy=Math.min(16,player.vy+.64);
 const oldY=player.y;
 player.x+=player.vx;
 player.y+=player.vy;
 player.x=Math.max(0,Math.min(worldWidth-player.w,player.x));
 player.on=false;

 for(const b of plats){
   if(player.x+player.w>b.x && player.x<b.x+b.w &&
      oldY+player.h<=b.y && player.y+player.h>=b.y && player.vy>=0){
     player.y=b.y-player.h;player.vy=0;player.on=true;
   }
 }

 // Several enemies patrol different platforms.
 for(const e of enemy){
   if(e.dead)continue;
   const eb=plats[e.platformIndex];
   e.y=eb.y-e.h;
   e.x+=e.vx;
   const min=eb.x+2,max=eb.x+eb.w-e.w-2;
   if(e.x<min){e.x=min;e.vx=Math.abs(e.vx)}
   if(e.x>max){e.x=max;e.vx=-Math.abs(e.vx)}
 }

 for(const s of stars){
   if(!s.got && Math.hypot(player.x+player.w/2-s.x,player.y+player.h/2-s.y)<30){
     s.got=true;
     sound("star");
     score++;
     document.getElementById("stars").textContent=`⭐ ${score} / 6`;
   }
 }

 for(const e of enemy){
   if(e.dead)continue;
   if(overlap(player,e)){
     // Jumping on an enemy defeats it and gives a bounce.
     if(player.vy>0 && player.y+player.h<e.y+28){
       e.dead=true;player.vy=-9;
     }else{
       loseLife();
       break;
     }
   }
 }

 if(overlap(player,flag)){finishLevel();return}
 if(player.y>H+120)loseLife();

 cam+=(player.x-W*.30-cam)*.10;
 cam=Math.max(0,Math.min(worldWidth-W,cam));
}

function finishLevel(){
 finished=true;
 sound("goal");
 const o=document.getElementById("overlay");
 o.textContent=DATA[level].msg;
 o.style.display="flex";
 setTimeout(()=>{
   o.style.display="none";
   if(level<2)setup(level+1);
   else{
     o.textContent="🎬 OYUN TAMAMLANDI! 🎬";
     o.style.display="flex";
     setTimeout(()=>{o.style.display="none";setup(0)},2200);
   }
 },1900);
}

function drawStar(x,y){
 ctx.save();ctx.translate(x,y);ctx.rotate(-.2);ctx.fillStyle="#fde047";
 ctx.beginPath();
 for(let i=0;i<10;i++){let r=i%2?7:16,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
 ctx.closePath();ctx.fill();ctx.restore();
}

function draw(){
 const d=DATA[level];
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,d.sky[0]);g.addColorStop(1,d.sky[1]);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(uploadedBackground.complete && uploadedBackground.naturalWidth){
   ctx.save();
   ctx.globalAlpha=0.16;
   const scale=Math.max(W/uploadedBackground.naturalWidth,(H*0.62)/uploadedBackground.naturalHeight);
   const bw=uploadedBackground.naturalWidth*scale,bh=uploadedBackground.naturalHeight*scale;
   ctx.drawImage(uploadedBackground,(W-bw)/2,H-bh+18,bw,bh);
   ctx.restore();
 }
 ctx.save();
 ctx.restore();
 ctx.save();ctx.translate(-cam,0);

 // This message belongs to the game world and therefore moves with the screen.
 ctx.globalAlpha=0.78;
 ctx.textAlign="center";
 ctx.font="900 27px Arial";
 ctx.lineWidth=5;
 ctx.strokeStyle="#111827aa";
 ctx.fillStyle="#ffffff";
 ctx.strokeText("BELİNAY SENİ ÇOK SEVİYOR", cam+W/2, H-112);
 ctx.fillText("BELİNAY SENİ ÇOK SEVİYOR", cam+W/2, H-112);

 // clouds
 ctx.fillStyle="#fff9";
 for(let i=0;i<7;i++){let x=i*210+70,y=80+(i%3)*45;
   ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.arc(x+28,y-12,30,0,Math.PI*2);ctx.arc(x+60,y,23,0,Math.PI*2);ctx.fill();
 }

 // platforms
 for(const b of plats){
   ctx.fillStyle="#8b4513";ctx.fillRect(b.x,b.y,b.w,b.h);
   ctx.fillStyle="#22c55e";ctx.fillRect(b.x,b.y,b.w,7);
 }

 for(const s of stars)if(!s.got)drawStar(s.x,s.y);

 // flag
 ctx.fillStyle="#334155";ctx.fillRect(flag.x,flag.y,6,105);
 ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(flag.x+6,flag.y);ctx.lineTo(flag.x+55,flag.y+18);ctx.lineTo(flag.x+6,flag.y+36);ctx.fill();

 // Belinay, açıkça görünen yüzü ve yüzün altında başlayan kıyafetiyle.
 for(const e of enemy)if(!e.dead){
   // Body first, deliberately lower so it cannot overlap the face.
   ctx.fillStyle="#7c3aed";
   ctx.beginPath();ctx.ellipse(e.x+38,e.y+51,34,16,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#5b21b6";ctx.fillRect(e.x+10,e.y+48,56,14);
   // Neck gap
   ctx.fillStyle="#f8d1b0";ctx.fillRect(e.x+31,e.y+31,14,10);
   // Head
   ctx.fillStyle="#f8d1b0";ctx.beginPath();ctx.arc(e.x+38,e.y+17,18,0,Math.PI*2);ctx.fill();
   // Hair, behind/around the head, not over the face.
   ctx.fillStyle="#ffe9a8";
   for(let i=0;i<11;i++){let a=i/11*Math.PI*2;ctx.beginPath();ctx.arc(e.x+38+Math.cos(a)*25,e.y+12+Math.sin(a)*22,8,0,Math.PI*2);ctx.fill()}
   ctx.fillStyle="#f8d1b0";ctx.beginPath();ctx.arc(e.x+38,e.y+18,16,0,Math.PI*2);ctx.fill();
   // Face
   ctx.fillStyle="#111";ctx.fillRect(e.x+31,e.y+15,4,5);ctx.fillRect(e.x+43,e.y+15,4,5);
   ctx.fillStyle="#fb7185";ctx.fillRect(e.x+33,e.y+26,10,3);
   // Shoes
   ctx.fillStyle="#1e293b";ctx.fillRect(e.x+17,e.y+58,15,5);ctx.fillRect(e.x+44,e.y+58,15,5);
 }

 // Selen: light skin, blonde curly hair, bright outfit
 ctx.fillStyle="#f5c2a8";ctx.beginPath();ctx.arc(player.x+16,player.y+18,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f7d34a";
 for(let i=0;i<14;i++){let a=i/14*Math.PI*2;ctx.beginPath();ctx.arc(player.x+16+Math.cos(a)*15,player.y+14+Math.sin(a)*14,8,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle="#7c3aed";ctx.fillRect(player.x+6,player.y+29,20,20);
 ctx.fillStyle="#f5c2a8";ctx.fillRect(player.x+1,player.y+31,7,16);ctx.fillRect(player.x+25,player.y+31,7,16);
 ctx.fillStyle="#2563eb";ctx.fillRect(player.x+6,player.y+47,9,7);ctx.fillRect(player.x+19,player.y+47,9,7);
 ctx.fillStyle="#111";ctx.fillRect(player.x+20,player.y+15,3,4);

 ctx.restore();

 // Screen-attached message: it stays fixed while the world scrolls.
 ctx.globalAlpha=0.82;
 ctx.textAlign="center";
 ctx.font="900 23px Arial";
 ctx.lineWidth=5;
 ctx.strokeStyle="#111827aa";
 ctx.fillStyle="#ffffff";
 ctx.strokeText("TİKTOK SERİMİZ BİTİYOR 💔", W/2, H-72);
 ctx.fillText("TİKTOK SERİMİZ BİTİYOR 💔", W/2, H-72);
 ctx.globalAlpha=1;
}

function loop(){update();draw();requestAnimationFrame(loop)}
setup(0);loop();
</script>
</body>
</html>
